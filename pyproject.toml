[project]
name = "agentic-review"
version = "0.1.0"
description = "A local CLI that reviews a TypeScript/JavaScript change set and emits schema-validated findings."
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pyyaml",
    "typer",
    "rich",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "jupyter>=1.1.1",
    "grandalf>=0.8",
    "langchain-ollama>=1.1.0",
    "langchain>=1.4.1",
    "groq>=1.7.0",
    "langfuse>=4.15.5",
]

[project.scripts]
agentic-review = "agentic_review.cli.app:main"

[dependency-groups]
dev = [
    "pytest",
    "import-linter",
    "jsonschema",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
